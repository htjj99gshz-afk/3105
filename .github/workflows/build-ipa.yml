name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Apply source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Persist the Swift/Xcode 26 exclusivity fix used by Arabic localization.
          localization = Path("ThreeOneOSFive/helpers/Localization.swift")
          source = localization.read_text()
          before = """        var output = [UInt8](repeating: 0, count: arabicPayloadSize)\n        let decodedCount = compressed.withUnsafeBytes { sourceBuffer -> Int in\n"""
          after = """        var output = [UInt8](repeating: 0, count: arabicPayloadSize)\n        let outputCapacity = output.count\n        let decodedCount = compressed.withUnsafeBytes { sourceBuffer -> Int in\n"""
          if before in source:
              source = source.replace(before, after, 1)
              source = source.replace(
                  "                    output.count,\n                    source,",
                  "                    outputCapacity,\n                    source,",
                  1,
              )
              localization.write_text(source)
              print("Updated Localization.swift for Xcode 26")
          elif "let outputCapacity = output.count" in source:
              print("Localization.swift already compatible")
          else:
              raise SystemExit("Expected Localization.swift decompression code was not found")

          # Selecting a language on onboarding should immediately continue to Welcome.
          onboarding = Path("ThreeOneOSFive/views/OnboardingView.swift")
          source = onboarding.read_text()
          old_action = """                    Button {\n                        withAnimation(.spring(response: 0.3, dampingFraction: 0.82)) {\n                            languageCode = option.rawValue\n                        }\n                    } label: {\n"""
          new_action = """                    Button {\n                        withAnimation(.spring(response: 0.3, dampingFraction: 0.82)) {\n                            languageCode = option.rawValue\n                            step = .welcome\n                        }\n                    } label: {\n"""
          if old_action in source:
              source = source.replace(old_action, new_action, 1)
          elif "step = .welcome" not in source:
              raise SystemExit("Expected onboarding language button was not found")

          old_subtitle = '                                Text(option.rawValue == "en" ? "English" : option.rawValue == "vi" ? "Tiếng Việt" : "简体中文")\n'
          new_subtitle = '                                Text(option.rawValue == "en" ? "English" : option.rawValue == "ar" ? "العربية" : option.rawValue == "vi" ? "Tiếng Việt" : "简体中文")\n'
          if old_subtitle in source:
              source = source.replace(old_subtitle, new_subtitle, 1)
          elif 'option.rawValue == "ar" ? "العربية"' not in source:
              raise SystemExit("Expected onboarding language subtitle was not found")

          onboarding.write_text(source)
          print("Updated OnboardingView.swift language selection flow")
          PY

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="$RUNNER_TEMP/3105-build"
          PAYLOAD_DIR="$RUNNER_TEMP/Payload"

          rm -rf "$BUILD_DIR" "$PAYLOAD_DIR"
          mkdir -p "$BUILD_DIR" "$PAYLOAD_DIR"

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$BUILD_DIR" \
            build

          test -d "$BUILD_DIR/3105.app"
          cp -R "$BUILD_DIR/3105.app" "$PAYLOAD_DIR/3105.app"

          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/3105-unsigned.ipa" Payload

          cd "$GITHUB_WORKSPACE"
          shasum -a 256 3105-unsigned.ipa > 3105-unsigned.ipa.sha256
          ls -lh 3105-unsigned.ipa 3105-unsigned.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: |
            3105-unsigned.ipa
            3105-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Commit source fixes and IPA into repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          cp 3105-unsigned.ipa dist/3105-unsigned.ipa
          cp 3105-unsigned.ipa.sha256 dist/3105-unsigned.ipa.sha256

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ThreeOneOSFive/helpers/Localization.swift
          git add ThreeOneOSFive/views/OnboardingView.swift
          git add -f dist/3105-unsigned.ipa dist/3105-unsigned.ipa.sha256

          if git diff --cached --quiet; then
            echo "Source and IPA are already current."
            exit 0
          fi

          git commit -m "fix: onboarding language selection and update IPA [skip ci]"
          git push origin HEAD:main

      - name: Publish latest unsigned IPA release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="latest-build"

          gh release delete "$TAG" --cleanup-tag --yes || true

          gh release create "$TAG" \
            3105-unsigned.ipa \
            3105-unsigned.ipa.sha256 \
            --target "$GITHUB_SHA" \
            --title "3105 Latest Unsigned IPA" \
            --notes "Unsigned IPA built automatically from the latest main commit ($GITHUB_SHA). Re-sign the IPA before installing it on an iPhone." \
            --prerelease
