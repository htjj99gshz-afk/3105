name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Apply Xcode 26 Swift exclusivity workaround
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("ThreeOneOSFive/helpers/Localization.swift")
          source = path.read_text()
          before = """        var output = [UInt8](repeating: 0, count: arabicPayloadSize)\n        let decodedCount = compressed.withUnsafeBytes { sourceBuffer -> Int in\n"""
          after = """        var output = [UInt8](repeating: 0, count: arabicPayloadSize)\n        let outputCapacity = output.count\n        let decodedCount = compressed.withUnsafeBytes { sourceBuffer -> Int in\n"""

          if before in source:
              source = source.replace(before, after, 1)
              source = source.replace("                    output.count,\n                    source,", "                    outputCapacity,\n                    source,", 1)
              path.write_text(source)
              print("Applied Swift exclusivity workaround to Localization.swift")
          elif "let outputCapacity = output.count" in source:
              print("Localization.swift is already compatible; no workaround needed")
          else:
              raise SystemExit("Expected Localization.swift decompression code was not found")
          PY

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="$RUNNER_TEMP/3105-build"
          PAYLOAD_DIR="$RUNNER_TEMP/Payload"

          rm -rf "$BUILD_DIR" "$PAYLOAD_DIR"
          mkdir -p "$BUILD_DIR" "$PAYLOAD_DIR"

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$BUILD_DIR" \
            build

          test -d "$BUILD_DIR/3105.app"
          cp -R "$BUILD_DIR/3105.app" "$PAYLOAD_DIR/3105.app"

          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/3105-unsigned.ipa" Payload

          cd "$GITHUB_WORKSPACE"
          shasum -a 256 3105-unsigned.ipa > 3105-unsigned.ipa.sha256
          ls -lh 3105-unsigned.ipa 3105-unsigned.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: |
            3105-unsigned.ipa
            3105-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Commit IPA into repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          cp 3105-unsigned.ipa dist/3105-unsigned.ipa
          cp 3105-unsigned.ipa.sha256 dist/3105-unsigned.ipa.sha256

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/3105-unsigned.ipa dist/3105-unsigned.ipa.sha256

          if git diff --cached --quiet; then
            echo "IPA is already current."
            exit 0
          fi

          git commit -m "build: update unsigned IPA [skip ci]"
          git push origin HEAD:main

      - name: Publish latest unsigned IPA release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="latest-build"

          gh release delete "$TAG" --cleanup-tag --yes || true

          gh release create "$TAG" \
            3105-unsigned.ipa \
            3105-unsigned.ipa.sha256 \
            --target "$GITHUB_SHA" \
            --title "3105 Latest Unsigned IPA" \
            --notes "Unsigned IPA built automatically from the latest main commit ($GITHUB_SHA). Re-sign the IPA before installing it on an iPhone." \
            --prerelease
