name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Prepare Arabic localization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import json
          import re
          import zlib

          localization = Path("ThreeOneOSFive/helpers/Localization.swift")
          source = localization.read_text()

          # Keep the existing compressed dictionary compatible with Xcode 26.
          before = """        var output = [UInt8](repeating: 0, count: arabicPayloadSize)\n        let decodedCount = compressed.withUnsafeBytes { sourceBuffer -> Int in\n"""
          after = """        var output = [UInt8](repeating: 0, count: arabicPayloadSize)\n        let outputCapacity = output.count\n        let decodedCount = compressed.withUnsafeBytes { sourceBuffer -> Int in\n"""
          if before in source:
              source = source.replace(before, after, 1)
              source = source.replace(
                  "                    output.count,\n                    source,",
                  "                    outputCapacity,\n                    source,",
                  1,
              )
          elif "let outputCapacity = output.count" not in source:
              raise SystemExit("Localization decompression block was not found")

          # Extra headroom makes runtime decompression tolerant across system releases.
          source = re.sub(
              r"private static let arabicPayloadSize = \d+",
              "private static let arabicPayloadSize = 262144",
              source,
              count=1,
          )
          localization.write_text(source)

          payload_section = source.split("private static let arabicPayloadBase64 =", 1)[1]
          payload_section = payload_section.split("\n}\n\nprivate struct AppLanguageEnvironmentKey", 1)[0]
          chunks = re.findall(r'"([A-Za-z0-9+/=]+)"', payload_section)
          if not chunks:
              raise SystemExit("Arabic payload was not found")

          raw = zlib.decompress(base64.b64decode("".join(chunks)))
          strings = json.loads(raw.decode("utf-8"))
          required = [
              "onboarding.step",
              "onboarding.language_title",
              "onboarding.welcome_title",
              "onboarding.welcome_message",
              "onboarding.welcome_badge",
              "common.next",
              "common.back",
              "common.finish",
          ]
          missing = [key for key in required if not strings.get(key)]
          if missing:
              raise SystemExit(f"Arabic payload missing keys: {missing}")

          # Generate a normal iOS ar.lproj fallback. AppLanguage will use this even if
          # the in-memory compressed dictionary cannot be decoded on a specific device.
          ar_dir = Path("ThreeOneOSFive/ar.lproj")
          ar_dir.mkdir(parents=True, exist_ok=True)
          strings_file = ar_dir / "Localizable.strings"
          lines = []
          for key in sorted(strings):
              k = json.dumps(key, ensure_ascii=False)
              v = json.dumps(strings[key], ensure_ascii=False)
              lines.append(f"{k} = {v};")
          strings_file.write_text("\n".join(lines) + "\n")

          # Add Arabic to the Xcode localization variant group.
          project = Path("ThreeOneOSFive.xcodeproj/project.pbxproj")
          pbx = project.read_text()
          ar_ref = '\t\t3105B124 /* ar */ = {isa = PBXFileReference; lastKnownFileType = text.plist.strings; name = ar; path = ar.lproj/Localizable.strings; sourceTree = "<group>"; };\n'
          if "3105B124 /* ar */" not in pbx:
              anchor = '\t\t3105B123 /* zh-Hans */ = {isa = PBXFileReference; lastKnownFileType = text.plist.strings; name = "zh-Hans"; path = "zh-Hans.lproj/Localizable.strings"; sourceTree = "<group>"; };\n'
              if anchor not in pbx:
                  raise SystemExit("Xcode localization file-reference anchor not found")
              pbx = pbx.replace(anchor, anchor + ar_ref, 1)

          if '\t\t\t\tar,\n' not in pbx:
              anchor = '\t\t\t\tvi,\n\t\t\t\t"zh-Hans",\n'
              if anchor not in pbx:
                  raise SystemExit("Xcode knownRegions anchor not found")
              pbx = pbx.replace(anchor, '\t\t\t\tvi,\n\t\t\t\tar,\n\t\t\t\t"zh-Hans",\n', 1)

          if '\t\t\t\t3105B124 /* ar */,\n' not in pbx:
              anchor = '\t\t\t\t3105B123 /* zh-Hans */,\n'
              if anchor not in pbx:
                  raise SystemExit("Xcode Localizable.strings variant-group anchor not found")
              pbx = pbx.replace(anchor, anchor + '\t\t\t\t3105B124 /* ar */,\n', 1)

          project.write_text(pbx)
          print(f"Arabic localization prepared: {len(strings)} strings, {len(raw)} decoded bytes")
          print("Welcome:", strings["onboarding.welcome_title"])
          PY

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="$RUNNER_TEMP/3105-build"
          PAYLOAD_DIR="$RUNNER_TEMP/Payload"

          rm -rf "$BUILD_DIR" "$PAYLOAD_DIR"
          mkdir -p "$BUILD_DIR" "$PAYLOAD_DIR"

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$BUILD_DIR" \
            build

          test -d "$BUILD_DIR/3105.app"
          test -f "$BUILD_DIR/3105.app/ar.lproj/Localizable.strings"
          /usr/bin/plutil -p "$BUILD_DIR/3105.app/ar.lproj/Localizable.strings" | grep -F "مرحبًا بك في 3105"

          cp -R "$BUILD_DIR/3105.app" "$PAYLOAD_DIR/3105.app"

          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/3105-unsigned.ipa" Payload

          cd "$GITHUB_WORKSPACE"
          shasum -a 256 3105-unsigned.ipa > 3105-unsigned.ipa.sha256
          ls -lh 3105-unsigned.ipa 3105-unsigned.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: |
            3105-unsigned.ipa
            3105-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Commit localization and IPA into repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          cp 3105-unsigned.ipa dist/3105-unsigned.ipa
          cp 3105-unsigned.ipa.sha256 dist/3105-unsigned.ipa.sha256

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ThreeOneOSFive/helpers/Localization.swift
          git add ThreeOneOSFive/ar.lproj/Localizable.strings
          git add ThreeOneOSFive.xcodeproj/project.pbxproj
          git add -f dist/3105-unsigned.ipa dist/3105-unsigned.ipa.sha256

          if git diff --cached --quiet; then
            echo "Localization and IPA are already current."
            exit 0
          fi

          git commit -m "build: bundle Arabic localization and update IPA [skip ci]"
          git push origin HEAD:main

      - name: Publish latest unsigned IPA release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="latest-build"

          gh release delete "$TAG" --cleanup-tag --yes || true

          gh release create "$TAG" \
            3105-unsigned.ipa \
            3105-unsigned.ipa.sha256 \
            --target "$GITHUB_SHA" \
            --title "3105 Latest Unsigned IPA" \
            --notes "Unsigned IPA built automatically from the latest main commit ($GITHUB_SHA). Re-sign the IPA before installing it on an iPhone." \
            --prerelease
