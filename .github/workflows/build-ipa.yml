name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Prepare Arabic localization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import json
          import re
          import zlib

          localization = Path("ThreeOneOSFive/helpers/Localization.swift")
          overrides = Path("ThreeOneOSFive/helpers/ArabicOverrides.swift")
          if not overrides.is_file():
              raise SystemExit("ArabicOverrides.swift is missing")

          source = localization.read_text()

          before = """        var output = [UInt8](repeating: 0, count: arabicPayloadSize)\n        let decodedCount = compressed.withUnsafeBytes { sourceBuffer -> Int in\n"""
          after = """        var output = [UInt8](repeating: 0, count: arabicPayloadSize)\n        let outputCapacity = output.count\n        let decodedCount = compressed.withUnsafeBytes { sourceBuffer -> Int in\n"""
          if before in source:
              source = source.replace(before, after, 1)
              source = source.replace(
                  "                    output.count,\n                    source,",
                  "                    outputCapacity,\n                    source,",
                  1,
              )
          elif "let outputCapacity = output.count" not in source:
              raise SystemExit("Localization decompression block was not found")

          source = re.sub(
              r"private static let arabicPayloadSize = \d+",
              "private static let arabicPayloadSize = 262144",
              source,
              count=1,
          )

          if "ArabicOverrides.value(for: key)" not in source:
              old_text = """    func text(_ key: String) -> String {\n        if self == .arabic, let value = Self.arabicStrings[key] {\n            return value\n        }\n        return localizedBundle.localizedString(forKey: key, value: key, table: nil)\n    }\n"""
              new_text = """    func text(_ key: String) -> String {\n        if self == .arabic {\n            if let value = ArabicOverrides.value(for: key) {\n                return value\n            }\n            if let value = Self.arabicStrings[key] {\n                return value\n            }\n        }\n        return localizedBundle.localizedString(forKey: key, value: key, table: nil)\n    }\n"""
              if old_text not in source:
                  raise SystemExit("AppLanguage.text localization block was not found")
              source = source.replace(old_text, new_text, 1)

          localization.write_text(source)

          payload_section = source.split("private static let arabicPayloadBase64 =", 1)[1]
          payload_section = payload_section.split("\n}\n\nprivate struct AppLanguageEnvironmentKey", 1)[0]
          chunks = re.findall(r'"([A-Za-z0-9+/=]+)"', payload_section)
          if not chunks:
              raise SystemExit("Arabic payload was not found")

          raw = zlib.decompress(base64.b64decode("".join(chunks)))
          strings = json.loads(raw.decode("utf-8"))
          required = [
              "onboarding.step",
              "onboarding.language_title",
              "onboarding.welcome_title",
              "onboarding.welcome_message",
              "onboarding.welcome_badge",
              "common.next",
              "common.back",
              "common.finish",
          ]
          missing = [key for key in required if not strings.get(key)]
          if missing:
              raise SystemExit(f"Arabic payload missing keys: {missing}")

          ar_dir = Path("ThreeOneOSFive/ar.lproj")
          ar_dir.mkdir(parents=True, exist_ok=True)
          strings_file = ar_dir / "Localizable.strings"
          lines = []
          for key in sorted(strings):
              k = json.dumps(key, ensure_ascii=False)
              v = json.dumps(strings[key], ensure_ascii=False)
              lines.append(f"{k} = {v};")
          strings_file.write_text("\n".join(lines) + "\n")

          project = Path("ThreeOneOSFive.xcodeproj/project.pbxproj")
          pbx = project.read_text()

          ar_ref = '\t\t3105B124 /* ar */ = {isa = PBXFileReference; lastKnownFileType = text.plist.strings; name = ar; path = ar.lproj/Localizable.strings; sourceTree = "<group>"; };\n'
          if "3105B124 /* ar */" not in pbx:
              anchor = '\t\t3105B123 /* zh-Hans */ = {isa = PBXFileReference; lastKnownFileType = text.plist.strings; name = "zh-Hans"; path = "zh-Hans.lproj/Localizable.strings"; sourceTree = "<group>"; };\n'
              if anchor not in pbx:
                  raise SystemExit("Xcode localization file-reference anchor not found")
              pbx = pbx.replace(anchor, anchor + ar_ref, 1)

          if '\t\t\t\tar,\n' not in pbx:
              anchor = '\t\t\t\tvi,\n\t\t\t\t"zh-Hans",\n'
              if anchor not in pbx:
                  raise SystemExit("Xcode knownRegions anchor not found")
              pbx = pbx.replace(anchor, '\t\t\t\tvi,\n\t\t\t\tar,\n\t\t\t\t"zh-Hans",\n', 1)

          if '\t\t\t\t3105B124 /* ar */,\n' not in pbx:
              anchor = '\t\t\t\t3105B123 /* zh-Hans */,\n'
              if anchor not in pbx:
                  raise SystemExit("Xcode Localizable.strings variant-group anchor not found")
              pbx = pbx.replace(anchor, anchor + '\t\t\t\t3105B124 /* ar */,\n', 1)

          override_build_ref = '\t\t3105M200 /* ArabicOverrides.swift in Sources */ = {isa = PBXBuildFile; fileRef = 3105M100; };\n'
          if "3105M200 /* ArabicOverrides.swift in Sources */" not in pbx:
              anchor = '\t\t3105A227 /* Localization.swift in Sources */ = {isa = PBXBuildFile; fileRef = 3105A099; };\n'
              if anchor not in pbx:
                  raise SystemExit("Localization build-file anchor not found")
              pbx = pbx.replace(anchor, anchor + override_build_ref, 1)

          override_file_ref = '\t\t3105M100 /* ArabicOverrides.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ArabicOverrides.swift; sourceTree = "<group>"; };\n'
          if "3105M100 /* ArabicOverrides.swift */" not in pbx:
              anchor = '\t\t3105A099 /* Localization.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = Localization.swift; sourceTree = "<group>"; };\n'
              if anchor not in pbx:
                  raise SystemExit("Localization file-reference anchor not found")
              pbx = pbx.replace(anchor, anchor + override_file_ref, 1)

          if '\t\t\t\t3105M100 /* ArabicOverrides.swift */,\n' not in pbx:
              anchor = '\t\t\t\t3105A099 /* Localization.swift */,\n'
              if anchor not in pbx:
                  raise SystemExit("Helpers group Localization anchor not found")
              pbx = pbx.replace(anchor, anchor + '\t\t\t\t3105M100 /* ArabicOverrides.swift */,\n', 1)

          if '\t\t\t\t3105M200,\n' not in pbx:
              anchor = '\t\t\t\t3105A227,\n'
              if anchor not in pbx:
                  raise SystemExit("Sources phase Localization anchor not found")
              pbx = pbx.replace(anchor, anchor + '\t\t\t\t3105M200,\n', 1)

          project.write_text(pbx)

          if "ArabicOverrides.value(for: key)" not in source:
              raise SystemExit("Arabic overrides were not connected to AppLanguage")
          if pbx.count("ArabicOverrides.swift") < 3:
              raise SystemExit("ArabicOverrides.swift was not fully registered in Xcode")
          print(f"Arabic localization prepared: {len(strings)} base strings + wording overrides")
          PY

      - name: Prepare native full-screen launch configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import plistlib

          launch = Path("ThreeOneOSFive/LaunchScreen.storyboard")
          if not launch.is_file():
              raise SystemExit("LaunchScreen.storyboard is missing")

          info_path = Path("ThreeOneOSFive/Info.plist")
          with info_path.open("rb") as f:
              info = plistlib.load(f)
          info.pop("UILaunchScreen", None)
          info["UILaunchStoryboardName"] = "LaunchScreen"
          info["UIRequiresFullScreen"] = True
          with info_path.open("wb") as f:
              plistlib.dump(info, f, sort_keys=False)

          project = Path("ThreeOneOSFive.xcodeproj/project.pbxproj")
          pbx = project.read_text()

          build_ref = '\t\t3105L200 /* LaunchScreen.storyboard in Resources */ = {isa = PBXBuildFile; fileRef = 3105L100; };\n'
          if "3105L200 /* LaunchScreen.storyboard in Resources */" not in pbx:
              anchor = '\t\t3105A228 /* Localizable.strings in Resources */ = {isa = PBXBuildFile; fileRef = 3105A120; };\n'
              if anchor not in pbx:
                  raise SystemExit("Resources build-file anchor not found")
              pbx = pbx.replace(anchor, anchor + build_ref, 1)

          file_ref = '\t\t3105L100 /* LaunchScreen.storyboard */ = {isa = PBXFileReference; lastKnownFileType = file.storyboard; path = LaunchScreen.storyboard; sourceTree = "<group>"; };\n'
          if "3105L100 /* LaunchScreen.storyboard */" not in pbx:
              anchor = '\t\t3105B124 /* ar */ = {isa = PBXFileReference; lastKnownFileType = text.plist.strings; name = ar; path = ar.lproj/Localizable.strings; sourceTree = "<group>"; };\n'
              if anchor not in pbx:
                  raise SystemExit("Launch-screen file-reference anchor not found")
              pbx = pbx.replace(anchor, anchor + file_ref, 1)

          if '\t\t\t\t3105L100 /* LaunchScreen.storyboard */,\n' not in pbx:
              anchor = '\t\t\t\t3105A060 /* Info.plist */,\n'
              if anchor not in pbx:
                  raise SystemExit("Main group Info.plist anchor not found")
              pbx = pbx.replace(anchor, anchor + '\t\t\t\t3105L100 /* LaunchScreen.storyboard */,\n', 1)

          if '\t\t\t\t3105L200,\n' not in pbx:
              anchor = '\t\t\t\t3105A228,\n'
              if anchor not in pbx:
                  raise SystemExit("Resources phase anchor not found")
              pbx = pbx.replace(anchor, anchor + '\t\t\t\t3105L200,\n', 1)

          pbx = pbx.replace(
              'INFOPLIST_KEY_UILaunchScreen_Generation = YES;',
              'INFOPLIST_KEY_UILaunchScreen_Generation = NO;'
          )
          if 'INFOPLIST_KEY_UILaunchStoryboardName = LaunchScreen;' not in pbx:
              pbx = pbx.replace(
                  'INFOPLIST_KEY_UILaunchScreen_Generation = NO;',
                  'INFOPLIST_KEY_UILaunchScreen_Generation = NO;\n\t\t\t\tINFOPLIST_KEY_UILaunchStoryboardName = LaunchScreen;\n\t\t\t\tINFOPLIST_KEY_UIRequiresFullScreen = YES;'
              )
          pbx = pbx.replace('TARGETED_DEVICE_FAMILY = "1,2";', 'TARGETED_DEVICE_FAMILY = 1;')

          project.write_text(pbx)

          if pbx.count("3105L100 /* LaunchScreen.storyboard */") < 2:
              raise SystemExit("LaunchScreen storyboard was not fully registered in the Xcode project")
          if "3105L200 /* LaunchScreen.storyboard in Resources */" not in pbx:
              raise SystemExit("LaunchScreen resource build file was not registered")
          print("Native iPhone full-screen launch configuration prepared")
          PY

      - name: Verify localization credit and app-name fallback source
        shell: bash
        run: |
          set -euo pipefail
          grep -F '@id7mee99' ThreeOneOSFive/views/SettingsView.swift
          grep -F 'https://t.me/id7mee99' ThreeOneOSFive/views/SettingsView.swift
          grep -F 'تم التعريب بواسطة' ThreeOneOSFive/views/SettingsView.swift
          grep -F 'ArabicOverrides.value(for: key)' ThreeOneOSFive/helpers/Localization.swift
          grep -F 'مشروع FilzaSlop واكتشاف التطبيقات عبر MHA-C2' ThreeOneOSFive/helpers/ArabicOverrides.swift
          grep -F 'com.toyopagroup.picaboo' ThreeOneOSFive/helpers/ContainerBrowserLogic.swift
          grep -F '"Snapchat"' ThreeOneOSFive/helpers/ContainerBrowserLogic.swift
          grep -F '"Amazon"' ThreeOneOSFive/helpers/ContainerBrowserLogic.swift
          grep -F '"YouTube"' ThreeOneOSFive/helpers/ContainerBrowserLogic.swift

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="$RUNNER_TEMP/3105-build"
          PAYLOAD_DIR="$RUNNER_TEMP/Payload"

          rm -rf "$BUILD_DIR" "$PAYLOAD_DIR"
          mkdir -p "$BUILD_DIR" "$PAYLOAD_DIR"

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$BUILD_DIR" \
            build

          test -d "$BUILD_DIR/3105.app"
          test -f "$BUILD_DIR/3105.app/ar.lproj/Localizable.strings"
          /usr/bin/plutil -p "$BUILD_DIR/3105.app/ar.lproj/Localizable.strings" | grep -F "مرحبًا بك في 3105"

          /usr/libexec/PlistBuddy -c "Print :UILaunchStoryboardName" "$BUILD_DIR/3105.app/Info.plist" | grep -Fx "LaunchScreen"
          /usr/libexec/PlistBuddy -c "Print :UIRequiresFullScreen" "$BUILD_DIR/3105.app/Info.plist" | grep -Fx "true"
          find "$BUILD_DIR/3105.app" -maxdepth 3 -name 'LaunchScreen.storyboardc' -print -quit | grep -q .

          cp -R "$BUILD_DIR/3105.app" "$PAYLOAD_DIR/3105.app"

          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/3105-unsigned.ipa" Payload

          cd "$GITHUB_WORKSPACE"
          shasum -a 256 3105-unsigned.ipa > 3105-unsigned.ipa.sha256
          ls -lh 3105-unsigned.ipa 3105-unsigned.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: |
            3105-unsigned.ipa
            3105-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Commit localization, full-screen configuration and IPA into repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          cp 3105-unsigned.ipa dist/3105-unsigned.ipa
          cp 3105-unsigned.ipa.sha256 dist/3105-unsigned.ipa.sha256

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ThreeOneOSFive/helpers/Localization.swift
          git add ThreeOneOSFive/helpers/ArabicOverrides.swift
          git add ThreeOneOSFive/ar.lproj/Localizable.strings
          git add ThreeOneOSFive/Info.plist
          git add ThreeOneOSFive/LaunchScreen.storyboard
          git add ThreeOneOSFive.xcodeproj/project.pbxproj
          git add -f dist/3105-unsigned.ipa dist/3105-unsigned.ipa.sha256

          if git diff --cached --quiet; then
            echo "Source configuration and IPA are already current."
            exit 0
          fi

          git commit -m "build: compile Arabic wording overrides and update IPA [skip ci]"
          git push origin HEAD:main

      - name: Publish latest unsigned IPA release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="latest-build"

          gh release delete "$TAG" --cleanup-tag --yes || true

          gh release create "$TAG" \
            3105-unsigned.ipa \
            3105-unsigned.ipa.sha256 \
            --target "$GITHUB_SHA" \
            --title "3105 Latest Unsigned IPA" \
            --notes "Unsigned IPA built automatically from the latest main commit ($GITHUB_SHA). Re-sign the IPA before installing it on an iPhone." \
            --prerelease
